pluginManagement {
  repositories {
    gradlePluginPortal()
  }
}

rootProject.name = 'dynmap-common'

/* This fork keeps only the Minecraft 1.20 / 1.20.1 Forge platform. The other platform
   modules (spigot, bukkit-helper-*, fabric-*, and the other forge-* versions) have been
   removed from the repository. Full multi-platform source: upstream tag v3.6. */

include ':DynmapCoreAPI'
include ':DynmapCore'
include ':forge-1.20'

project(':DynmapCoreAPI').projectDir = "$rootDir/DynmapCoreAPI" as File
project(':DynmapCore').projectDir = "$rootDir/DynmapCore" as File
project(':forge-1.20').projectDir = "$rootDir/forge-1.20" as File