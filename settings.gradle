pluginManagement {
  repositories {
    gradlePluginPortal()
    maven { url "https://papermc.io/repo/repository/maven-public/" }
    maven { url "https://maven.fabricmc.net/" }
  }
}

rootProject.name = 'dynmap-common'

/* Minimal build surface: only what :forge-1.20:build needs.
   Original 40+ project settings.gradle is preserved as settings.gradle.orig */

include ':DynmapCoreAPI'
include ':DynmapCore'
include ':forge-1.20'

project(':DynmapCoreAPI').projectDir = "$rootDir/DynmapCoreAPI" as File
project(':DynmapCore').projectDir = "$rootDir/DynmapCore" as File
project(':forge-1.20').projectDir = "$rootDir/forge-1.20" as File